project_id = "ravecomtupiyurjezwji"

# Resend posts inbound email here and cannot send a Supabase JWT, so this
# endpoint is public. It authenticates the caller by verifying the Svix
# signature against RESEND_WEBHOOK_SECRET instead.
[functions.resend-inbound-webhook]
verify_jwt = false

# Called by pg_cron (no JWT); authenticated by the x-cron-secret header
# checked against the CRON_SECRET held in Supabase Vault.
[functions.send-stay-reminders]
verify_jwt = false

# Called by pg_cron (x-cron-secret) and by the dashboard (signed-in user's
# token, checked inside the function), so the gateway JWT check is off.
[functions.send-quiet-code-checkins]
verify_jwt = false
